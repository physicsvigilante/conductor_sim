name: M40c actual static named-source relocation and real offline Chromium
on:
  pull_request:
    paths:
      - 'src/conductor_sim/spherical_sigma_relocation*.py'
      - 'src/conductor_sim/spherical_multicavity.py'
      - 'src/conductor_sim/cavity_gauss.py'
      - 'tools/m40c*'
      - 'tools/check_m40c*'
      - 'tools/m40a_spherical_reference.py'
      - 'tests/test_m40c*'
      - 'docs/m40c*'
      - '.github/workflows/m40c-static-relocation.yml'
  push:
    branches: [m40c-static-source-relocation, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-relocation-and-independent-kelvin:
    name: original 3D source identity, signed local sigma, separate real+Kelvin (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - name: Freeze literal code/tree and source PDF identity
        run: |
          set -euo pipefail
          mkdir -p review-artifacts/m40c
          git rev-parse HEAD | tee review-artifacts/m40c/head.txt
          git rev-parse HEAD^{tree} | tee review-artifacts/m40c/tree.txt
          sha256sum docs/m40c_charter.md 02_conductors_half_size.pdf POTENTIAL_CONDUCTORS1.pdf | tee review-artifacts/m40c/source-hashes.txt
      - name: Actual static source and hostile SI/numerical tests
        run: |
          set -euo pipefail
          python -m pytest tests/test_m40c_static_relocation.py tests/test_m40a_spherical_multicavity.py -q --junitxml=review-artifacts/m40c/tests.xml
          python -m tools.m40c_static_example --output-dir review-artifacts/m40c
          python -m tools.m40c_static_reference --input review-artifacts/m40c/m40c-static-teacher.json --output review-artifacts/m40c/separate-image-witness.json
      - name: Preserve first true positive and negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m40c-physical-revisions-py${{ matrix.python-version }}
          path: review-artifacts/m40c/
          retention-days: 21
          if-no-files-found: warn
  real-offline-chromium:
    name: actual Chromium JS enabled and disabled, mobile, signed SI and CSP
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -e '.[test]' 'playwright==1.57.0'
          python -m playwright install chromium
      - name: Record exact source and original PDF identity
        run: |
          mkdir -p review-artifacts/m40c
          git rev-parse HEAD | tee review-artifacts/m40c/head.txt
          git rev-parse HEAD^{tree} | tee review-artifacts/m40c/tree.txt
          sha256sum docs/m40c_charter.md 02_conductors_half_size.pdf POTENTIAL_CONDUCTORS1.pdf | tee review-artifacts/m40c/source-hashes.txt
      - name: Genuine browser and independent source-density consistency
        run: |
          set -euo pipefail
          python -m tools.check_m40c_static_browser --output-dir review-artifacts/m40c
          python -m tools.m40c_static_reference --input review-artifacts/m40c/m40c-static-teacher.json --output review-artifacts/m40c/independent-witness.json
      - name: Preserve actual DOM screenshots, XSS and SI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m40c-actual-chromium-nojs-mobile
          path: review-artifacts/m40c/
          retention-days: 21
          if-no-files-found: warn
