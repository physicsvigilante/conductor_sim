name: M35a publish locally audited candidate to development branch only
on:
  push:
    branches: [m35a-multistage-exploration-audit]
    paths: ['.github/workflows/m35a-stage-candidate.yml']
permissions:
  contents: write
jobs:
  publish-tested-patches:
    if: github.ref == 'refs/heads/m35a-multistage-exploration-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}
      - name: Verify original charter parent and immutable released base
        run: |
          test "$(git rev-parse HEAD^)" = 'ba19e12c519df2338df5dbb9293e9fa7ebd611a8'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 'a5113fa4cc924ac10cbb35b2f2d7ac80e11f1bde'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Apply separately hashed audit corrections then multistage feature
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, subprocess
          allowed=('src/conductor_sim/', 'tests/', 'examples/', 'tools/', 'docs/', 'README.md')
          specs=[('corrections', 'f6a339b4372fd94382de8263937c9c2b8a225fc21ea8307eb2a7bea01f9cb203', 'M35a audit: revalidate native requests and normalize subnormal directions safely'),
                 ('multistage', 'f2f2b73a60a9d7dbaa2207b7843247e1b921794f5e55a23779c008501e767e34', 'M35a: compose bounded native exploration stages and document audited guarantees')]
          for name,digest,message in specs:
              files=([Path('.m35a-transfer/corrections.b64')] if name=='corrections' else
                     [Path(f'.m35a-transfer/multistage-{i}.b64') for i in range(4)])
              encoded=b''.join(p.read_bytes() for p in files)
              patch=lzma.decompress(base64.b64decode(encoded, validate=True))
              assert hashlib.sha256(patch).hexdigest()==digest, 'Patch transport digest mismatch'
              for line in patch.decode().splitlines():
                  if line.startswith('+++ b/'):
                      path=line[6:]
                      assert path.startswith(allowed) and '..' not in Path(path).parts, path
              subprocess.run(['git','apply','--unidiff-zero','--check','--index','-'],input=patch,check=True)
              subprocess.run(['git','apply','--unidiff-zero','--index','-'],input=patch,check=True)
              subprocess.run(['git','diff','--cached','--check'],check=True)
              subprocess.run(['git','commit','-m',message],check=True)
          PY
      - name: Correct the documented full-suite depth fixture without changing production physics
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_m35a_multistage_exploration.py')
          s=p.read_text()
          old="CoupledPropertyEdit('test-particle', 'mass_kg', (stage+3)*1e-6),)))"
          new="CoupledPropertyEdit('test-particle', 'mass_kg', (stage*5+i+3)*1e-6),)))"
          assert old in s
          p.write_text(s.replace(old,new))
          p=Path('docs/m35a_audit.md')
          s=p.read_text()
          s+='\nThe first expanded full-suite run also exposed an audit-test fixture that repeated an unchanged mass at consecutive depth-test nodes. The engine correctly rejected the no-op edit and skipped its descendants; the fixture now uses distinct masses. That original failed run is retained, and its 2,029 passing tests plus one fixture failure are not presented as a fully green suite.\n'
          p.write_text(s)
          PY
          git add tests/test_m35a_multistage_exploration.py docs/m35a_audit.md
          git commit -m 'M35a: correct depth fixture to use genuine mass changes and retain failed attempt'
      - name: Validate transferred source bytes and push only the guarded development branch
        run: |
          python -m compileall -q src/conductor_sim examples/m35a_multistage_exploration.py tests/test_m35a_audit_corrections.py tests/test_m35a_multistage_exploration.py tools/m35a_audit.py tools/m35a_independent_multistage.py tools/m35a_legacy_snapshot.py tools/check_m35a_references.py
          git diff --check
          test "$(git ls-remote origin refs/heads/m35a-multistage-exploration-audit | cut -f1)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree}
          git push origin HEAD:refs/heads/m35a-multistage-exploration-audit
