name: M22a structural composability review
on:
  pull_request:
    paths: ['docs/m22a*', '.github/workflows/m22a-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact pre-implementation source
        run: |
          mkdir -p snapshot
          git rev-parse HEAD > snapshot/commit.txt
          git rev-parse HEAD^{tree} > snapshot/tree.txt
          git archive --format=tar.gz HEAD > snapshot/source.tar.gz
          sha256sum snapshot/source.tar.gz > snapshot/source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: m22a-exact-source
          path: snapshot/
          retention-days: 2
          if-no-files-found: error
