name: M24b temporary exact source preparation
on:
  pull_request:
    paths:
      - 'docs/m24b_charter.md'
      - '.github/workflows/m24b-source-preparation.yml'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact tracked text and blob manifest without PDFs
        run: |
          mkdir -p prepared-source
          git rev-parse HEAD > prepared-source/commit.txt
          git rev-parse HEAD^{tree} > prepared-source/tree.txt
          git ls-tree -r HEAD > prepared-source/blobs.txt
          python - <<'PY'
          import subprocess, tarfile
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with tarfile.open('prepared-source/source.tar.gz','w:gz') as archive:
              for path in files:
                  if path and not path.endswith('.pdf'):
                      archive.add(path, arcname=path, recursive=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m24b-exact-text-source
          path: prepared-source/
          retention-days: 3
          if-no-files-found: error
