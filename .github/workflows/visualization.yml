name: Visualization and source checks
on:
  push:
    branches: [m5-visualization-review, m6-pdf-authorability, main]
  pull_request:
permissions:
  contents: read
jobs:
  visualization:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]" "playwright==1.57.0"
      - run: python -m playwright install chromium
      - name: Archive exact source
        run: |
          mkdir -p review-artifacts
          git archive --format=zip HEAD -o review-artifacts/source.zip
          git rev-parse HEAD > review-artifacts/commit.txt
      - run: python -m pytest -m "not femm5" -q --junitxml=review-artifacts/python.xml
      - run: python examples/visualize_conductors.py --output review-artifacts/analytical.html
      - name: Browser acceptance (no external requests)
        run: python tools/check_viewer.py review-artifacts/analytical.html --screenshot review-artifacts/preview.png > review-artifacts/browser.json
      - name: M6 PDF benchmark physics and classification
        run: python -m conductor_sim.pdf_benchmark check --output review-artifacts/m6-report.json
      - name: M6 PDF authoring sweep render
        run: python -m conductor_sim.pdf_benchmark render p69-cavity-central-vs-shifted --resolution 31 --output review-artifacts/m6-induction.html
      - name: Browser acceptance of PDF-authored simulation
        run: python tools/check_viewer.py review-artifacts/m6-induction.html --screenshot review-artifacts/m6-induction.png > review-artifacts/m6-browser.json
      - name: M6b authorability grading (new JEE tasks)
        run: python -m m6b.evaluate grade --output review-artifacts/m6b-report.json
      - name: M6b grounded two-state export
        run: python -m m6b.evaluate render grounded-two-state-sweep --resolution 31 --output review-artifacts/m6b-sweep.html
      - name: Chromium acceptance of authored M6b simulation
        run: python tools/check_viewer.py review-artifacts/m6b-sweep.html --screenshot review-artifacts/m6b-sweep.png > review-artifacts/m6b-browser.json
      - name: M7 exterior grounded solid sphere preview
        run: python examples/femm5_external_sphere.py --resolution 31 --output review-artifacts/m7-external.html
      - name: M7 Chromium export acceptance
        run: python tools/check_viewer.py review-artifacts/m7-external.html --screenshot review-artifacts/m7-external.png > review-artifacts/m7-browser.json
      - name: M8 grounded and isolated sphere preview (analytical)
        run: python examples/femm5_isolated_sphere.py --resolution 27 --output review-artifacts/m8-isolated.html
      - name: M8 offline Chromium viewer acceptance
        run: python tools/check_viewer.py review-artifacts/m8-isolated.html --screenshot review-artifacts/m8-isolated.png > review-artifacts/m8-browser.json
      - name: M9 multiple external sources analytical HTML
        run: python examples/femm5_multi_external.py --backend analytical --resolution 31 --output review-artifacts/m9-multi-external.html
      - name: M9 Chromium offline multi-source acceptance
        run: python tools/check_viewer.py review-artifacts/m9-multi-external.html --screenshot review-artifacts/m9-multi-external.png > review-artifacts/m9-browser.json
      - name: M10 grounded-plane analytical preview
        run: python examples/femm5_grounded_plane.py --resolution 25 --output review-artifacts/m10-plane.html
      - name: M10 Chromium grounded-plane geometry acceptance
        run: python tools/check_viewer.py review-artifacts/m10-plane.html --screenshot review-artifacts/m10-plane.png > review-artifacts/m10-plane-browser.json
      - name: M11 analytical multi-source grounded plane export
        run: python examples/femm5_multi_plane.py --resolution 25 --output review-artifacts/m11-multi-plane.html
      - name: M11 Chromium multi-source grounded plane
        run: python tools/check_viewer.py review-artifacts/m11-multi-plane.html --screenshot review-artifacts/m11-multi-plane.png > review-artifacts/m11-browser.json
      - name: M12a analytical parallel-plate three-state preview
        run: python examples/parallel_plates.py --resolution 25 --image-order 48 --output review-artifacts/m12a-parallel-plates.html
      - name: M12a Chromium offline electrode and density acceptance
        run: python tools/check_viewer.py review-artifacts/m12a-parallel-plates.html --screenshot review-artifacts/m12a-parallel-plates.png > review-artifacts/m12a-browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conductor-visualization-review
          path: review-artifacts/
          retention-days: 14
          if-no-files-found: error
