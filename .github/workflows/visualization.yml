name: Visualization and source checks
on:
  push:
    branches: [m5-visualization-review, main]
  pull_request:
permissions:
  contents: read
jobs:
  visualization:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -m "not femm5" -q
      - name: Export inspected source
        run: |
          mkdir -p review-artifacts
          git archive --format=zip HEAD -o review-artifacts/source.zip
          git rev-parse HEAD > review-artifacts/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: conductor-visualization-review
          path: review-artifacts/
          retention-days: 14
          if-no-files-found: error
