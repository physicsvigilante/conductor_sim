name: M41a real source-anchored JEE-14 teaching trial and independent SI
on:
  pull_request:
    paths:
      - 'src/conductor_sim/**'
      - 'pyproject.toml'
      - '02_conductors_half_size.pdf'
      - 'POTENTIAL_CONDUCTORS1.pdf'
      - 'docs/m36a_jee30_coverage.json'
      - 'docs/m41a*'
      - 'tools/m41a*'
      - 'tools/check_m41a*'
      - 'tests/test_m41a*'
      - 'tools/m36b_jee*'
      - 'tools/m36c_jee*'
      - 'tools/m36d_*'
      - 'tools/m37b_source*'
      - 'tools/check_m36*'
      - 'tools/check_m37b*'
      - '.github/workflows/m41a-source-trial.yml'
  push:
    branches: [main, m41a-jee-source-trial]
    paths:
      - 'src/conductor_sim/**'
      - 'pyproject.toml'
      - '02_conductors_half_size.pdf'
      - 'POTENTIAL_CONDUCTORS1.pdf'
      - 'docs/m36a_jee30_coverage.json'
      - 'docs/m41a*'
      - 'tools/m41a*'
      - 'tools/check_m41a*'
      - 'tests/test_m41a*'
      - 'tools/m36b_jee*'
      - 'tools/m36c_jee*'
      - 'tools/m36d_*'
      - 'tools/m37b_source*'
      - 'tools/check_m36*'
      - 'tools/check_m37b*'
      - '.github/workflows/m41a-source-trial.yml'
permissions:
  contents: read
jobs:
  source-native-and-separate-reference:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source and test runner
        run: python -m pip install -e '.[test]'
      - name: Preserve exact Git source and original-PDF evidence
        run: |
          mkdir -p review-artifacts/m41a
          git rev-parse HEAD | tee review-artifacts/m41a/head.txt
          git rev-parse HEAD^{tree} | tee review-artifacts/m41a/tree.txt
          sha256sum docs/m41a_charter.md 02_conductors_half_size.pdf POTENTIAL_CONDUCTORS1.pdf docs/m36a_jee30_coverage.json | tee review-artifacts/m41a/original-source-hashes.txt
      - name: Execute ALL registered original-source native routes and distinct SI references
        run: |
          set -euo pipefail
          python -m tools.m41a_jee_trial --output-dir review-artifacts/m41a
          python -m tools.m41a_jee_trial --output-dir review-artifacts/m41a --verify-existing
      - name: Adversarial denominator/attribution/source-Kelvin regressions
        run: python -m pytest -q tests/test_m41a_jee_trial.py --junitxml=review-artifacts/m41a/review-junit.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m41a-jee14-source-science-py${{ matrix.python-version }}
          path: review-artifacts/m41a/
          retention-days: 30
  genuine-chromium-original-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source and REAL Chromium
        run: |
          python -m pip install -e '.[test]'
          python -m pip install playwright==1.57.0
          python -m playwright install chromium
      - name: Check precise source Git identity
        run: |
          mkdir -p review-artifacts/m41a
          git rev-parse HEAD | tee review-artifacts/m41a/head.txt
          git rev-parse HEAD^{tree} | tee review-artifacts/m41a/tree.txt
          sha256sum docs/m41a_charter.md 02_conductors_half_size.pdf POTENTIAL_CONDUCTORS1.pdf | tee review-artifacts/m41a/original-source-hashes.txt
      - name: Generate authentic source-native viewers and independent references
        run: python -m tools.m41a_jee_trial --output-dir review-artifacts/m41a
      - name: Real JS enabled/disabled desktop/mobile source p61; inherited actual original-JEE source viewers
        run: |
          set -euo pipefail
          python -m tools.check_m41a_jee_browser --output-dir review-artifacts/m41a
          python -m tools.check_m36b_jee_browser --output-dir review-artifacts/m41a/m36b
          python -m tools.check_m36c_conductors_browser --output-dir review-artifacts/m41a/m36c
          python -m tools.check_m36d_solid_browser --output-dir review-artifacts/m41a/m36d
          python -m tools.check_m37b_prescribed_browser --output-dir review-artifacts/m41a/m37b
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m41a-jee14-real-chromium-native-and-source-screenshots
          path: review-artifacts/m41a/
          retention-days: 30
