name: Python checks
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - run: python examples/concentric_shell.py
      - run: python -m conductor_sim.pdf_benchmark check
      - run: python examples/force_energy.py --output output/force_energy.json
      - run: python -m m13c.evaluate grade --output output/m13c-grade.json
      - run: python examples/force_energy_explorer.py --steps 3 --resolution 9 --image-order 12 --line-steps 12 --output output/m13b-explorer.html
