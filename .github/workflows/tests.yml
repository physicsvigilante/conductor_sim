name: Python checks
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - run: python examples/concentric_shell.py
      - run: python -m conductor_sim.pdf_benchmark check
      - run: python examples/force_energy.py --output output/force_energy.json
      - run: python examples/particle_motion_1d.py --case cavity --duration-s .06 --sample-interval-s .01 --output output/m16a-cavity.json
      - run: python examples/particle_motion_1d.py --case plates --charge-c=-1.602176634e-19 --mass-kg 9.1093837139e-31 --duration-s 5e-8 --sample-interval-s 5e-9 --output output/m16a-electron.json
      - run: python examples/connected_shells.py --case pdf-p14-q7 --resolution 11 --line-steps 20 --output output/m14-shells.html
      - run: python examples/solid_sphere_connected.py --case pdf-p03-q27 --resolution 11 --line-steps 20 --output output/m14b-solid.html
      - run: python examples/solid_sphere_connected.py --case pdf-p10-q13-q14 --resolution 11 --line-steps 20 --output output/m14b-shells.html
      - run: python -m m13c.evaluate grade --output output/m13c-grade.json
      - run: python -m m13c.pdf_cases grade --output output/m13c-pdf-audit.json
      - run: python examples/force_energy_explorer.py --steps 3 --resolution 9 --image-order 12 --line-steps 12 --output output/m13b-explorer.html
      - run: python examples/force_energy_explorer.py --case cavity-grounded --steps 3 --resolution 11 --line-steps 18 --output output/m15-cavity-grounded.html
      - run: python examples/force_energy_explorer.py --case cavity-nested --steps 3 --resolution 11 --line-steps 18 --output output/m15-cavity-nested.html
