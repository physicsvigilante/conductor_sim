name: M36c real conductor-JEE source physics and Chromium
on:
  push:
    branches: [m36c-jee-conductor-replays, main]
  pull_request:
permissions:
  contents: read

jobs:
  conductor-source-replays:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install qualified source engine, pytest and offline Chromium
        run: |
          python -m pip install -e ".[test]" "playwright==1.57.0"
          python -m playwright install chromium
      - name: Record true source provenance and literal original PDF hashes
        run: |
          set -eu
          mkdir -p review-artifacts/m36c
          git rev-parse HEAD | tee review-artifacts/m36c/source-commit.txt
          git rev-parse HEAD^{tree} | tee review-artifacts/m36c/source-tree.txt
          sha256sum 02_conductors_half_size.pdf POTENTIAL_CONDUCTORS1.pdf > review-artifacts/m36c/pdf-sha256.txt
      - name: Execute genuine original conductor source models and tamper-negative regressions
        run: python -m pytest tests/test_m36c_jee_conductors.py -q --junitxml=review-artifacts/m36c/focused-physics.xml
      - name: Export seven authentic independent conductor apparatus (one linked Q13-Q14)
        run: python -m tools.m36c_jee_conductor_replay --output-dir review-artifacts/m36c
      - name: Check independently expressed static Gauss Kelvin and conductor energy formulas
        run: python -m tools.m36c_jee_conductor_reference --input review-artifacts/m36c/native-conductors.json --output review-artifacts/m36c/independent-conductor-physics.json
      - name: Inspect seven actual original source static viewers in offline Chromium
        run: python -m tools.check_m36c_conductors_browser --output-dir review-artifacts/m36c
      - name: Preserve source truth, native results, independent SI, viewer HTML and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m36c-jee-conductor-source-physics
          path: review-artifacts/m36c/
          retention-days: 21
          if-no-files-found: warn
