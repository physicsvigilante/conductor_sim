name: M18c held-source authoring and independent physics
on:
  pull_request:
    paths: ['src/**', 'm18c/**', 'tests/**', 'tools/**', '.github/workflows/m18c-review.yml']
  push:
    branches: [main]
    paths: ['src/**', 'm18c/**', 'tests/**', 'tools/**', '.github/workflows/m18c-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  held-source-authoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]" "playwright==1.57.0"
      - run: python -m playwright install chromium
      - name: Independent Green-function references and authoring mutations
        run: |
          mkdir -p review-artifacts
          git rev-parse HEAD > review-artifacts/commit.txt
          git rev-parse HEAD^{tree} > review-artifacts/tree.txt
          python -m pytest tests/test_m18c_authoring.py -q --junitxml=review-artifacts/m18c-tests.xml
          python -m m18c.evaluate grade --output review-artifacts/m18c-grade.json
      - name: Existing production exporter and offline Chromium acceptance
        run: |
          for case in plane-three nested-cavity biased-plates; do
            python -m m18c.evaluate render "$case" --resolution 13 --visual-frames 6 --output "review-artifacts/m18c-$case.html"
            python tools/check_m18b_viewer.py "review-artifacts/m18c-$case.html" --screenshot "review-artifacts/m18c-$case.png" > "review-artifacts/m18c-$case-browser.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m18c-held-source-authoring-review
          path: review-artifacts/
          retention-days: 14
          if-no-files-found: error
