name: Temporary post-M24b verified blob preparation
on:
  push:
    branches: [post-m24b-correctness]
    paths: ['.github/workflows/post-m24b-materialize.yml']
permissions:
  contents: write
jobs:
  verify-source-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5eb12091839e1325278a40b0927d2fb56a81bae8
          persist-credentials: false
      - name: Apply exact reviewed patch and create verified blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          root='https://api.github.com/repos/physicsvigilante/conductor_sim'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'}
          def api(path,data=None):
              payload=None if data is None else json.dumps(data).encode()
              req=urllib.request.Request(root+path,data=payload,headers=headers,method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          blob=api('/git/blobs/1ca196559a249056f1bd3460476b202522c2cefb')
          patch=base64.b64decode(blob['content'])
          assert hashlib.sha256(patch).hexdigest()=='9958824fc418937f53d411f9a87f969dd38708ab92ba41ea31d812038e37f288'
          path=pathlib.Path('/tmp/review.patch');path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          expected={
              '.github/workflows/m21b-review.yml':'351dc10a5fe85d55eee56f0af0791d5f153070fe',
              'src/conductor_sim/driven_motion.py':'5eda1e76443590e388948c74702f82e0a58597d4',
              'src/conductor_sim/driven_viewer.py':'d56f181d7b6f6ed7fd9b4d2a9100bc1e748d7eb4',
              'src/conductor_sim/motion_events.py':'997c7066a2dd776b1c3bf699170b9dba32ec3af3',
          }
          changed=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          assert set(changed)==set(expected)
          for filename,sha in expected.items():
              content=pathlib.Path(filename).read_bytes()
              actual=hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
              assert actual==sha,(filename,actual)
              created=api('/git/blobs',{'encoding':'base64','content':base64.b64encode(content).decode()})
              assert created['sha']==sha,(filename,created)
          out=pathlib.Path('prepared-blobs');out.mkdir()
          (out/'manifest.json').write_text(json.dumps(expected,indent=2)+'\n')
          (out/'scope.txt').write_text('Four exact source objects only; no branch, commit, ref or main update performed.\n')
          print(json.dumps(expected,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: post-m24b-candidate-blobs
          path: prepared-blobs/
          retention-days: 3
          if-no-files-found: error
