name: Post-M40b reproduced numerical defects and dependency audit
on:
  pull_request:
    paths:
      - 'src/conductor_sim/**'
      - 'tools/m40b_spherical_atlas_reference.py'
      - 'tests/test_post_m40b*'
      - 'docs/post_m40b*'
      - 'docs/current_capabilities.md'
      - 'docs/architecture.md'
      - '.github/workflows/**'
      - 'pyproject.toml'
  push:
    branches: [main, audit/post-m40b-corrections]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: post-m40b-audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  reproduced-defects:
    name: red baseline and corrected contracts (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact candidate
        run: python -m pip install -e ".[test]"
      - name: Pin source, tree and unchanged source documents
        run: |
          set -euo pipefail
          mkdir -p review-artifacts/post-m40b
          git rev-parse HEAD | tee review-artifacts/post-m40b/head.txt
          git rev-parse HEAD^{tree} | tee review-artifacts/post-m40b/tree.txt
          sha256sum docs/post_m40b_audit_charter.md 02_conductors_half_size.pdf POTENTIAL_CONDUCTORS1.pdf | tee review-artifacts/post-m40b/hashes.txt
      - name: Preserve expected red baseline and demand green correction
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/post-m40b-baseline" 4bae2f6be5a1689b9e1dc80d2dd146b77d366a3e
          python - <<'PY'
          import os, pathlib, subprocess, sys, xml.etree.ElementTree as ET
          root = pathlib.Path.cwd()
          baseline = pathlib.Path(os.environ['RUNNER_TEMP']) / 'post-m40b-baseline'
          evidence = root / 'review-artifacts/post-m40b'
          tests = [str(root / 'tests/test_post_m40b_audit.py'),
                   str(root / 'tests/test_post_m40b_workflow_dependencies.py')]
          for name, checkout, expected_failures in [('baseline', baseline, 37), ('candidate', root, 0)]:
              env = os.environ.copy()
              env['PYTHONPATH'] = str(checkout/'src') + os.pathsep + str(checkout)
              env['CONDUCTOR_AUDIT_ROOT'] = str(checkout)
              xml = evidence / (name+'.xml')
              run = subprocess.run([sys.executable, '-m', 'pytest', *tests, '-q', '--junitxml='+str(xml)],
                                   cwd=checkout, env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              (evidence/(name+'.log')).write_text(run.stdout, encoding='utf-8')
              print(run.stdout)
              suites = list(ET.parse(xml).getroot().iter('testsuite'))
              failures = sum(int(s.get('failures', 0)) for s in suites)
              errors = sum(int(s.get('errors', 0)) for s in suites)
              count = sum(int(s.get('tests', 0)) for s in suites)
              assert count == 43 and failures == expected_failures and errors == 0, (name, count, failures, errors)
              assert run.returncode == (1 if expected_failures else 0), (name, run.returncode)
          PY
      - name: Preserve first-run logs including expected baseline failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-m40b-reproduced-defects-py${{ matrix.python }}
          path: review-artifacts/post-m40b/
          retention-days: 30
          if-no-files-found: error
