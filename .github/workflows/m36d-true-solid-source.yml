name: M36d true solid conductor source JEE physics and Chromium
on:
  push:
    branches: [m36d-standalone-solid-sphere, main]
  pull_request:
permissions:
  contents: read

jobs:
  true-solid-original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real qualified physical engine and offline Chromium
        run: |
          python -m pip install -e ".[test]" "playwright==1.57.0"
          python -m playwright install chromium
      - name: Record true source HEAD TREE and original PDF source hashes
        run: |
          mkdir -p review-artifacts/m36d
          git rev-parse HEAD | tee review-artifacts/m36d/source-commit.txt
          git rev-parse HEAD^{tree} | tee review-artifacts/m36d/source-tree.txt
          sha256sum 02_conductors_half_size.pdf POTENTIAL_CONDUCTORS1.pdf | tee review-artifacts/m36d/pdf-sha256.txt
      - name: Test genuinely standalone solid sphere, old M14b and M6 compatibility, hostility
        run: python -m pytest tests/test_m36d_true_solid_sphere.py -q --junitxml=review-artifacts/m36d/focused-physics.xml
      - name: Export TRUE solid-sphere original and two teacher-native worlds
        run: python -m tools.m36d_true_solid_sphere --output-dir review-artifacts/m36d
      - name: Independently derive Gauss potential E and outer sigma without engine
        run: python -m tools.m36d_solid_reference --input review-artifacts/m36d/native-solid-sphere.json --output review-artifacts/m36d/independent-source-physics.json
      - name: Real Chromium source-authentic SOLID original and changed world inspections
        run: python -m tools.check_m36d_solid_browser --output-dir review-artifacts/m36d
      - name: Retain source identity physical observations visual results and first failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m36d-true-solid-source-physics
          path: review-artifacts/m36d/
          retention-days: 21
          if-no-files-found: warn
