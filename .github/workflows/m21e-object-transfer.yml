name: M21e exact reviewed object transfer
on:
  pull_request:
    paths: ['.github/workflows/m21e-object-transfer.yml']
permissions:
  contents: write
jobs:
  exact-objects-only:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'm21e-composable-electric-gravity'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '55c813a861c3911a5a8ec39d186f05e03bd274b3'
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reviewed patch and create content-addressed objects only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          REPO='physicsvigilante/conductor_sim'
          BASE='55c813a861c3911a5a8ec39d186f05e03bd274b3'
          BASE_TREE='9e4c84c1403a26d148a35c25bc70bd7e2253a053'
          TARGET='d4fa3f028a6e8c15aa269f67806c10d23e4bbb8d'
          PIN='5baaab26ed291e3cd14ba5297b9e46db6ca188260573e9238d40757ee2567fc0'
          CHUNKS=['c8b45d92ad5a8e105ff250a9f512e928679e9d6f','50be7213f3ca5410869096c07959244b7f897a9a','f9ee9e228f2f723b298cb1f8b05ee4f1a98b51ad','774b1929d6baf79a83c4f560f8e25293c81ef622']
          PATHS=['.github/workflows/m21e-review.yml','README.md','docs/m21e.md','examples/electric_gravity_motion.py','src/conductor_sim/__init__.py','src/conductor_sim/conservative_forces.py','src/conductor_sim/gravity_viewer.py','src/conductor_sim/prescribed_motion.py','src/conductor_sim/prescribed_viewer.py','src/conductor_sim/prescribed_viewer_validation.py','src/conductor_sim/scenario_comparison.py','src/conductor_sim/scenarios.py','src/conductor_sim/viewer.py','tests/test_m21e_composed_forces.py','tools/check_m21e_viewer.py']
          def git(*args):
              return subprocess.check_output(['git',*args]).decode().strip()
          def api(path, payload=None):
              # This transfer never calls commits, refs, pulls or workflow APIs.
              assert path.startswith('git/blobs') or path=='git/trees'
              request=urllib.request.Request('https://api.github.com/repos/'+REPO+'/'+path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                           'Accept':'application/vnd.github+json','Content-Type':'application/json',
                           'X-GitHub-Api-Version':'2022-11-28'},
                  method='GET' if payload is None else 'POST')
              with urllib.request.urlopen(request,timeout=60) as response:
                  return json.load(response)
          def blob_sha(content):
              return hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
          assert git('rev-parse','HEAD')==BASE
          assert git('rev-parse','HEAD^{tree}')==BASE_TREE
          parts=[]
          for sha in CHUNKS:
              record=api('git/blobs/'+sha)
              assert record['encoding']=='base64'
              content=base64.b64decode(record['content'])
              assert blob_sha(content)==sha
              parts.append(content)
          patch=lzma.decompress(b''.join(parts))
          assert hashlib.sha256(patch).hexdigest()==PIN
          subprocess.run(['git','apply','--index','--whitespace=error','-'],input=patch,check=True)
          assert git('diff','--cached','--name-only').splitlines()==PATHS
          assert git('write-tree')==TARGET
          entries=[]
          for path in PATHS:
              content=pathlib.Path(path).read_bytes()
              expected=blob_sha(content)
              record=api('git/blobs',{'encoding':'base64','content':base64.b64encode(content).decode()})
              assert record['sha']==expected
              entries.append({'path':path,'mode':'100644','type':'blob','sha':expected})
          tree=api('git/trees',{'base_tree':BASE_TREE,'tree':entries})
          assert tree['sha']==TARGET
          out=pathlib.Path('object-evidence');out.mkdir()
          result={'base_commit':BASE,'base_tree':BASE_TREE,'target_tree':tree['sha'],
                  'patch_sha256':PIN,'files':entries,'refs_modified':False,
                  'note':'Content-addressed objects only. Review and branch movement require a separate connector action. This temporary workflow is absent from the target tree.'}
          (out/'objects.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps({'target_tree':tree['sha'],'files':len(entries),'refs_modified':False}))
      - uses: actions/upload-artifact@v4
        with:
          name: m21e-exact-object-bindings
          path: object-evidence/
          retention-days: 2
          if-no-files-found: error
