name: M31b independent Coulomb / DOP853 transfer

on:
  push:
    branches: [m31b-coupled-event-observations]
  pull_request:
    paths:
      - "src/conductor_sim/coupled_event_family.py"
      - "tests/test_m31b_coupled_event_family.py"
      - "tools/m31b_independent_dop853.py"
      - "examples/m31b_rod_reference.py"
      - ".github/workflows/m31b_independent_reference.yml"

jobs:
  independent-m31b-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Show exact source commit
        run: git rev-parse HEAD
      - name: Install production package and independently written numeric reference requirements
        run: |
          python -m pip install -e .
          python -m pip install numpy scipy
      - name: Save actual M31b native event observations
        run: python examples/m31b_rod_reference.py --output output/m31b-rod-native.json
      - name: Challenge native event times with standalone DOP853 and rod quadrature
        run: python tools/m31b_independent_dop853.py --native output/m31b-rod-native.json --output output/m31b-dop853-reference.json
      - name: Seal retained evidence
        run: |
          sha256sum output/m31b-rod-native.json output/m31b-dop853-reference.json > output/m31b-sha256.txt
          cat output/m31b-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m31b-independent-native-and-dop853
          path: |
            output/m31b-rod-native.json
            output/m31b-dop853-reference.json
            output/m31b-sha256.txt
          if-no-files-found: error
