name: M37a grounded-sphere wire-current science and SI export audit

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'tools/**'
      - 'docs/m37a*'
      - '.github/workflows/m37a-grounded-sphere-wire.yml'
  push:
    branches:
      - m37a-grounded-sphere-wire-current
  workflow_dispatch:

jobs:
  actual-kelvin-current:
    name: real Kelvin current and independent SI (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and source tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]"
      - name: Verify actual Kelvin charge, derivative, force and motion
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/test_m37a_grounded_wire_current.py tests/test_m16_motion_1d.py tests/test_m13_observables.py -q
      - name: Generate genuine teacher and integrated radial-motion evidence
        shell: bash
        run: |
          set -euo pipefail
          python examples/grounded_sphere_wire_current.py --output output/m37a/ground-wire-current.json
          python -m tools.m37a_ground_wire_reference --input output/m37a/ground-wire-current.json
      - name: Retain genuine SI evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m37a-wire-current-py${{ matrix.python-version }}
          path: output/m37a/ground-wire-current.json
          if-no-files-found: warn
