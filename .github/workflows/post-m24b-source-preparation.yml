name: Temporary post-M24b exact source preparation
on:
  push:
    branches: [post-m24b-correctness]
    paths: ['.github/workflows/post-m24b-source-preparation.yml']
permissions:
  contents: read
jobs:
  exact-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5eb12091839e1325278a40b0927d2fb56a81bae8
      - name: Archive fixed baseline and exact Git identities
        run: |
          mkdir -p prepared-source
          git rev-parse HEAD > prepared-source/commit.txt
          git rev-parse HEAD^{tree} > prepared-source/tree.txt
          git ls-tree -r HEAD > prepared-source/blobs.txt
          git archive --format=tar.gz HEAD > prepared-source/source.tar.gz
          sha256sum prepared-source/source.tar.gz > prepared-source/source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: post-m24b-exact-baseline
          path: prepared-source/
          retention-days: 3
          if-no-files-found: error
