name: M18b held-source viewer and correctness
on:
  pull_request:
    paths: ['src/**', 'examples/**', 'tests/**', 'tools/**', '.github/workflows/m18b-review.yml']
  push:
    branches: [main]
    paths: ['src/**', 'examples/**', 'tests/**', 'tools/**', '.github/workflows/m18b-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  held-source-viewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]" "playwright==1.57.0"
      - run: python -m playwright install chromium
      - name: Time-grid, saved-data and full-inventory regressions
        run: |
          mkdir -p review-artifacts
          git rev-parse HEAD > review-artifacts/commit.txt
          git rev-parse HEAD^{tree} > review-artifacts/tree.txt
          python -m pytest tests/test_post_m18_review.py tests/test_m18a_fixed_sources.py tests/test_m18b_motion_viewer.py -q --junitxml=review-artifacts/m18b-tests.xml
      - name: Offline multi-charge frames, marker roles, arrows and playback
        run: |
          for case in plane sphere nested guard; do
            duration=.12; if [ "$case" = guard ]; then duration=.5; fi
            python examples/particle_motion_fixed_viewer.py --case "$case" --duration-s "$duration" --resolution 13 --visual-frames 6 --line-steps 25 --output "review-artifacts/m18b-$case.html"
            python tools/check_m18b_viewer.py "review-artifacts/m18b-$case.html" --screenshot "review-artifacts/m18b-$case.png" > "review-artifacts/m18b-$case-browser.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m18b-held-source-review
          path: review-artifacts/
          retention-days: 14
          if-no-files-found: error
