name: Legacy source viewers in offline Chromium
on:
  pull_request:
    paths: &viewer_paths
      - '.github/workflows/legacy-source-viewers.yml'
      - 'tools/legacy_source_fallback.py'
      - 'tools/test_legacy_source_viewers_browser.py'
      - 'tools/m36b_jee_replay.py'
      - 'tools/m36c_jee_conductor_replay.py'
      - 'tools/m36d_true_solid_sphere.py'
      - 'src/conductor_sim/**'
      - 'examples/**'
  push:
    branches: [main]
    paths: *viewer_paths
permissions:
  contents: read
jobs:
  offline-viewers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]" "playwright==1.57.0"
      - run: python -m playwright install --with-deps chromium
      - run: mkdir -p review-artifacts
      - run: python -m pytest tools/test_legacy_source_viewers_browser.py -q --basetemp=review-artifacts/issue111
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-source-viewer-screenshots
          path: review-artifacts/issue111/**/*.png
