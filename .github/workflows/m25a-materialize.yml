name: Temporary M25a exact-source extraction
on:
  push:
    branches:
      - m25a-qualified-source-geometry
    paths:
      - '.github/workflows/m25a-materialize.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete candidate then expose public source blobs
        shell: bash
        run: |
          set -euo pipefail
          cat .m25a-prep/chunk*.b64 > /tmp/m25a-archive.b64
          test "$(sha256sum /tmp/m25a-archive.b64 | cut -d' ' -f1)" = "bb8760dee628cc8287c76c8390dc8df268145f6aaeedc3295565535ce0b57484"
          base64 -d /tmp/m25a-archive.b64 | xz -d > /tmp/m25a-full.patch
          test "$(sha256sum /tmp/m25a-full.patch | cut -d' ' -f1)" = "53ebb2d377d7c0ec972dfa56942c4d1316eeec690cbe830fd831acd7be04c695"
          git apply --check /tmp/m25a-full.patch
          git apply /tmp/m25a-full.patch
          git rm -r .m25a-prep .github/workflows/m25a-materialize.yml
          git add -A
          test "$(git write-tree)" = "0bff159adec1a67e2be8f657ab5486dfe06a3060"
          for path in \
            .github/workflows/m21b-review.yml \
            docs/m25a.md docs/m25a_charter.md docs/m25a_reserved_card.md \
            src/conductor_sim/driven_viewer.py src/conductor_sim/motion_event_viewer.py src/conductor_sim/source_geometry.py \
            tests/test_m25a_source_geometry.py tools/check_m25a_source_geometry.py tools/check_m25a_transfer.py; do
            sha="$(git hash-object "$path")"
            printf 'M25A_BLOB_BEGIN|%s|%s\n' "$path" "$sha"
            base64 -w 0 "$path"
            printf '\nM25A_BLOB_END|%s\n' "$path"
          done
